name: mercado-cero-pilot
services:
  web:
    image: mercado-cero:${BUILD_SHA:?Set the full Git SHA}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:?Set the full Git SHA}
    restart: unless-stopped
    init: true
    environment:
      DEMO_MODE: "true"
      APP_URL: ${APP_URL:-http://localhost:4590}
      DATABASE_PATH: /data/mercado-cero.db
      DATABASE_BACKUP_DIR: /data/backups
      DEMO_RESET_TOKEN: ${DEMO_RESET_TOKEN:?Set a private reset token}
      PEY_API_KEY: ""
      PEY_WEBHOOK_SECRET: ""
      OPENAI_API_KEY: ""
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:${MC_BIND_PORT:-4590}:3000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy

  litestream:
    profiles: [replication]
    image: litestream/litestream:0.5.14
    user: "1000:1000"
    restart: unless-stopped
    command: [replicate, -config, /etc/litestream.yml]
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      web:
        condition: service_healthy

volumes:
  data:
