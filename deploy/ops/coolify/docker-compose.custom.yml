# Official base + prod files; overrides stay private and survive vendor updates.
services:
  coolify:
    image: coollabsio/coolify@sha256:8821fbb5d1eb083a7378d9c0f6c85eae56ba0171b69947ebcb415eb8133706d7
    ports: !override
      - "127.0.0.1:4592:8080"
      - "127.0.0.1:4593:6001"
      - "127.0.0.1:4594:6002"
    mem_limit: 1536m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
    mem_limit: 384m
    cpus: 0.5
  redis:
    image: redis@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG']
  soketi:
    image: coollabsio/coolify@sha256:8821fbb5d1eb083a7378d9c0f6c85eae56ba0171b69947ebcb415eb8133706d7
networks:
  coolify:
    external: false
    ipam:
      config:
        - subnet: 172.31.0.0/24
