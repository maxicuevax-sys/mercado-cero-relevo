name: harness

on:
  push:
  pull_request:

jobs:
  static:
    name: Guardrails + unit tests + lint + types + deps + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Harness unit tests
        run: npm run test:harness

      - name: Harness static gate
        run: npm run verify:static
