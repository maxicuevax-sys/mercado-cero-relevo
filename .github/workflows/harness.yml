name: harness

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Guardrails + unit tests + lint + types + deps + build + contratos
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit producción (dev queda fuera)
        run: npm audit --omit=dev

      - name: Harness unit tests
        run: npm run test:harness

      - name: Account identity and business isolation contracts
        run: |
          npm run test:business-profile
          npm run test:tenant-business
          npm run test:pilot-identity
          npm run test:register-validation
          npm run test:account-browser-state
          npm run test:prod-pilot
          npm run test:judge-recovery

      - name: Joint account operational backup and restore contracts
        run: |
          python3 ../deploy/ops/test_judge_backup.py
          python3 ../deploy/ops/test_verify_judge_snapshot.py
          pwsh -NoProfile -File ../deploy/ops/test-backup-windows.ps1
          python3 ../deploy/ops/test_runtime_target.py
          python3 ../deploy/ops/test_legacy_archive.py
          python3 ../deploy/ops/test_watchdog.py
          python3 ../deploy/ops/test_validate_judge_release.py
          node --test ../deploy/ops/configure-kuma.test.cjs

      - name: Harness static gate (build con BUILD_SHA)
        run: npm run verify:static

      - name: Install isolated QR decoder test dependencies
        run: python3 -m pip install -r scripts/qr-test-requirements.txt

      - name: Real-test payment and QR rendering contracts
        run: |
          npm run test:pey-real-test
          npm run test:tianguis-qr

      - name: Contrato de seguridad
        run: npm run test:security

      - name: Contrato de datos P0
        run: npm run test:fix-datos

      - name: Presupuesto de performance
        run: npm run test:perf-budget

      - name: Contrato de rendimiento de datos
        run: npm run test:perf-data

      - name: Chromium for isolated account browser contracts
        run: npx playwright install --with-deps chromium

      - name: Real two-session demo account flows
        run: npm run test:judge-accounts

      - name: Tabla de la evidencia
        run: npm run harness:report

  # Gate de release: exige un servidor y un túnel ya desplegados desde ESTE
  # commit. Corre en un runner self-hosted con acceso a la DB de la demo y a
  # los secretos del entorno `release`. No arranca túneles desde CI.
  full-release:
    name: Full 23/23 contra servidor construido desde HEAD
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: release
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    env:
      BASE_URL: ${{ secrets.HARNESS_BASE_URL }}
      APP_URL: ${{ secrets.HARNESS_APP_URL }}
      DATABASE_PATH: ${{ secrets.HARNESS_DATABASE_PATH }}
      PEY_WEBHOOK_SECRET: ${{ secrets.PEY_WEBHOOK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build local para los gates p0 aislados
        run: npm run build

      - name: Python + Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Exigir secretos de release
        run: |
          test -n "$BASE_URL" || (echo "Falta HARNESS_BASE_URL" && exit 1)
          test -n "$APP_URL" || (echo "Falta HARNESS_APP_URL (túnel HTTPS)" && exit 1)
          test -n "$DATABASE_PATH" || (echo "Falta HARNESS_DATABASE_PATH" && exit 1)
          test -n "$PEY_WEBHOOK_SECRET" || (echo "Falta PEY_WEBHOOK_SECRET" && exit 1)

      - name: Full gate
        run: npm run verify:full

      - name: Verificar evidencia
        run: npm run verify:evidence

      - name: Tabla de la evidencia
        run: npm run harness:report
