name: harness

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Guardrails + unit tests + lint + types + deps + build + contratos
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit producción (dev queda fuera)
        run: npm audit --omit=dev

      - name: Harness unit tests
        run: npm run test:harness

      - name: Account identity and business isolation contracts
        run: |
          npm run test:sentry
          npm run test:guest-entry
          npm run test:browser-preferences
          npm run test:judge-config
          npm run test:demo-checkout
          npm run test:corte-receipts
          npm run test:format-timezone
          npm run test:currency-groups
          npm run test:business-profile
          npm run test:tenant-business
          npm run test:pilot-identity
          npm run test:register-validation
          npm run test:account-browser-state
          npm run test:prod-pilot
          npm run test:judge-recovery

      - name: Joint account operational backup and restore contracts
        run: |
          python3 ../deploy/ops/test_judge_backup.py
          python3 ../deploy/ops/test_verify_judge_snapshot.py
          pwsh -NoProfile -File ../deploy/ops/test-backup-windows.ps1
          python3 ../deploy/ops/test_runtime_target.py
          python3 ../deploy/ops/test_legacy_archive.py
          python3 ../deploy/ops/test_watchdog.py
          python3 ../deploy/ops/test_validate_judge_release.py
          node --test ../deploy/ops/configure-kuma.test.cjs

      - name: Harness static gate (build con BUILD_SHA)
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
          SENTRY_ORG: leadly-ld
          SENTRY_PROJECT: mercado-cero-relevo
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: npm run verify:static

      - name: Verify canonical static evidence before export
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          npm run verify:evidence -- --static
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.SENTRY_AUTH_TOKEN;
          for (const file of ['../harness/evidence/latest-static.json', '.next/BUILD_SHA']) {
            if (token && fs.readFileSync(file, 'utf8').includes(token)) {
              throw new Error('Unexpected secret in evidence; export blocked');
            }
          }
          NODE

      - name: Export only static evidence and build identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            harness/evidence/latest-static.json
            web/.next/BUILD_SHA
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Install isolated QR decoder test dependencies
        run: python3 -m pip install -r scripts/qr-test-requirements.txt

      - name: Real-test payment and QR rendering contracts
        run: |
          npm run test:pey-real-test
          npm run test:tianguis-qr

      - name: Contrato de seguridad
        run: npm run test:security

      - name: Voice amount and preset contracts
        run: |
          npm run test:voice
          npm run test:codi-amount

      - name: Contrato de datos P0
        run: npm run test:fix-datos

      - name: Presupuesto de performance
        run: npm run test:perf-budget

      - name: Contrato de rendimiento de datos
        run: npm run test:perf-data

      - name: Chromium and WebKit for isolated account browser contracts
        run: npx playwright install --with-deps chromium webkit

      - name: Real two-session demo account flows
        run: |
          JUDGE_BROWSER=chromium npm run test:judge-accounts
          JUDGE_BROWSER=webkit npm run test:judge-accounts

      - name: Tabla de la evidencia
        run: npm run harness:report

  # Advisory nocturno: mide el presupuesto móvil del build real y publica el
  # reporte. Corre solo en schedule/dispatch para no añadir minutos ni
  # inestabilidad a cada PR.
  lighthouse:
    name: Lighthouse mobile budget (scheduled, advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Advisory until the open LCP finding is fixed: publica el reporte y no
    # bloquea el resto del harness. Pasar a bloqueante cuando LCP <= 3000 ms.
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Start production server on 3154
        run: |
          nohup npm start -- -p 3154 > /tmp/trangui-lighthouse-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:3154/api/health > /dev/null; then
              echo "server ready after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready; log follows"
          cat /tmp/trangui-lighthouse-server.log
          exit 1

      - name: Lighthouse mobile with assertions
        env:
          BASE_URL: http://127.0.0.1:3154
          LH_OUT: ${{ github.workspace }}/lighthouse-mobile.json
        run: npm run lighthouse:mobile -- --assert

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-mobile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/lighthouse-mobile.json
          if-no-files-found: warn
          retention-days: 14
