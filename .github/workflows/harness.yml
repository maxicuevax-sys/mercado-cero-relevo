name: harness

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Guardrails + unit tests + lint + types + deps + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit producción (dev queda fuera)
        run: npm audit --omit=dev

      - name: Harness unit tests
        run: npm run test:harness

      - name: Harness static gate
        run: npm run verify:static
